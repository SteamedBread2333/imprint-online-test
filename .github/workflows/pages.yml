# Publish experiment/report/ to GitHub Pages (project site).
# Enable: repo Settings → Pages → Build and deployment → GitHub Actions.
# URL: https://<owner>.github.io/imprint-online-test/

name: GitHub Pages — experiment reports

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rerun_experiment:
        description: Re-run full experiment before deploy (downloads imprint + HF tokenizer)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install imprint binaries
        if: github.event_name == 'workflow_dispatch' && inputs.rerun_experiment
        run: bash experiment/scripts/install_imprint_bin.sh

      - name: Regenerate HTML reports
        if: github.event_name == 'workflow_dispatch' && inputs.rerun_experiment
        env:
          IMPRINT_MCP: ${{ github.workspace }}/experiment/bin/imprint-mcp
          HF_HOME: ${{ github.workspace }}/.cache/huggingface
        run: python3 experiment/scripts/run_all.py

      - name: Verify report artifacts
        run: |
          test -f experiment/report/index.html
          test -f experiment/report/report.html
          test -f experiment/report/retrieval.html
          test -f experiment/report/record.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: experiment/report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
